services:
    keycloak:
        environment:
            # KC 26 renamed the bootstrap admin env vars
            # (KEYCLOAK_ADMIN / KEYCLOAK_ADMIN_PASSWORD were removed).
            KC_BOOTSTRAP_ADMIN_USERNAME: admin
            KC_BOOTSTRAP_ADMIN_PASSWORD: admin
        volumes:
            # Mount every JAR produced by `mvn package` into providers/.
            # restart=always or `docker compose restart keycloak` re-loads them.
            - ./target:/opt/keycloak/providers:ro
        command: [ "start-dev", "--features=declarative-ui" ]
